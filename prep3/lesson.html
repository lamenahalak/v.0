<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>لميناهالك | الثالث الإعدادي</title>
    <link rel="icon" href="./images/logo.png" type="image/png" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />
    <style>
        :root {
            --primary: #3062e3;
            --primary-dark: #1f45b0;
            --accent: #ffb347;
            --bg: #f4f7fe;
            --card: #ffffff;
            --text: #12203f;
            --muted: #6b84a8;
            --border: #e6ecf7;
            --success: #22b573;
            --dark-overlay: rgba(0, 0, 0, 0.85);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { -webkit-text-size-adjust: 100%; }
        body {
            font-family: 'Tajawal', 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ===== HEADER ===== */
        .app-header {
            background: linear-gradient(135deg, var(--primary-dark), var(--primary));
            padding: 16px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 6px 24px rgba(48, 98, 227, 0.25);
        }
        .app-header .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #fff;
            font-size: 1.4rem;
            font-weight: 800;
            text-decoration: none;
            white-space: nowrap;
        }
        .app-header .logo .logo-img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            background: #fff;
            padding: 2px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        .app-header .header-actions {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .app-header .header-actions .user-name {
            color: #cfe0ff;
            font-weight: 500;
            font-size: 0.9rem;
        }
        .app-header .header-actions .back-btn {
            color: #fff;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.18);
            padding: 8px 20px;
            border-radius: 40px;
            text-decoration: none;
            font-weight: 600;
            transition: 0.3s;
            font-size: 0.85rem;
            cursor: pointer;
            font-family: inherit;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }
        .app-header .header-actions .back-btn:hover { background: rgba(255, 255, 255, 0.22); }

        /* ===== MAIN LAYOUT ===== */
        .main-content {
            max-width: 1180px;
            margin: 0 auto;
            padding: 32px 20px 70px;
        }
        .layout {
            display: grid;
            grid-template-columns: 1fr 360px;
            gap: 30px;
            align-items: start;
        }

        /* ===== HERO ===== */
        .course-hero {
            background: #fff;
            border-radius: 28px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(18, 32, 63, 0.06);
            border: 1px solid var(--border);
            margin-bottom: 26px;
        }
        .course-hero .hero-img {
            width: 100%;
            height: 280px;
            background: linear-gradient(145deg, #e9f0ff, #dbe6ff);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 5rem;
            color: var(--primary);
            position: relative;
            overflow: hidden;
        }
        .course-hero .hero-img img { width: 100%; height: 100%; object-fit: cover; }
        .course-hero .hero-img .price-chip {
            position: absolute;
            top: 18px;
            left: 18px;
            background: var(--accent);
            color: #12203f;
            font-weight: 800;
            padding: 8px 20px;
            border-radius: 40px;
            font-size: 0.95rem;
            box-shadow: 0 6px 18px rgba(255, 179, 71, 0.4);
        }
        .course-hero .hero-body { padding: 26px 30px 30px; }
        .course-hero .hero-body .badge {
            display: inline-block;
            background: #e9efff;
            color: var(--primary);
            padding: 5px 16px;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 700;
            margin-bottom: 12px;
        }
        .course-hero .hero-body h1 {
            font-size: 1.9rem;
            font-weight: 800;
            margin-bottom: 10px;
            color: var(--text);
            line-height: 1.3;
            word-wrap: break-word;
        }
        .course-hero .hero-body .teacher-row {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--muted);
            font-size: 0.95rem;
            margin-bottom: 16px;
        }
        .course-hero .hero-body .teacher-row .t-avatar {
            width: 34px; height: 34px;
            border-radius: 50%;
            background: var(--primary);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            font-weight: 700;
            flex-shrink: 0;
        }
        .course-hero .hero-body .description {
            color: #3d5578;
            line-height: 1.8;
            font-size: 0.98rem;
            margin-bottom: 20px;
        }
        .course-hero .hero-body .stats-row {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
        }
        .course-hero .hero-body .stats-row .stat {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--bg);
            border: 1px solid var(--border);
            padding: 8px 18px;
            border-radius: 14px;
            font-size: 0.85rem;
            color: #3d5578;
            font-weight: 600;
        }
        .course-hero .hero-body .stats-row .stat i { color: var(--primary); }

        /* ===== TABS ===== */
        .tabs-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            background: #fff;
            padding: 6px;
            border-radius: 16px;
            border: 1px solid var(--border);
            width: fit-content;
            max-width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        .tabs-bar::-webkit-scrollbar { display: none; }
        .tabs-bar .tab-btn {
            padding: 10px 24px;
            border-radius: 12px;
            border: none;
            background: transparent;
            color: var(--muted);
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            font-family: inherit;
            transition: 0.2s;
            white-space: nowrap;
        }
        .tabs-bar .tab-btn.active { background: var(--primary); color: #fff; }

        /* ===== LESSONS ===== */
        .section-card {
            background: #fff;
            border-radius: 24px;
            padding: 26px 26px 30px;
            border: 1px solid var(--border);
            box-shadow: 0 6px 24px rgba(18, 32, 63, 0.04);
        }
        .section-title {
            font-size: 1.2rem;
            font-weight: 800;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text);
        }
        .section-title .count { font-size: 0.8rem; color: var(--muted); font-weight: 500; }

        .lesson-card {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 16px 20px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 16px;
            transition: 0.25s;
            cursor: pointer;
        }
        .lesson-card:hover { border-color: #c8d8fb; box-shadow: 0 4px 16px rgba(48, 98, 227, 0.08); }
        .lesson-card .lesson-num {
            width: 40px; height: 40px;
            border-radius: 12px;
            background: #fff;
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.95rem;
            font-weight: 800;
            flex-shrink: 0;
            border: 1px solid var(--border);
        }
        .lesson-card .lesson-info { flex: 1; min-width: 0; }
        .lesson-card .lesson-info h3 {
            font-size: 0.98rem;
            font-weight: 700;
            color: var(--text);
            word-wrap: break-word;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }
        .lesson-card .lesson-info .lesson-meta {
            display: flex;
            gap: 14px;
            font-size: 0.78rem;
            color: var(--muted);
            margin-top: 3px;
            flex-wrap: wrap;
            align-items: center;
        }
        .lesson-card .lesson-status {
            font-size: 0.75rem;
            font-weight: 700;
            padding: 5px 14px;
            border-radius: 40px;
            flex-shrink: 0;
            white-space: nowrap;
        }
        .lesson-card .lesson-status.free { color: var(--success); background: #e4f8ee; }
        .lesson-card .lesson-status.available { color: var(--primary); background: #e9efff; }
        .lesson-card .lesson-type-badge {
            font-size: 0.7rem;
            padding: 4px 10px;
            border-radius: 30px;
            background: var(--border);
            color: var(--muted);
            font-weight: 600;
            flex-shrink: 0;
            white-space: nowrap;
        }
        .lesson-card .lesson-type-badge.video { background: #e9efff; color: var(--primary); }
        .lesson-card .lesson-type-badge.file { background: #fef0e6; color: #e67e22; }
        .lesson-card .lesson-arrow { color: #c8d8fb; flex-shrink: 0; }

        .empty-state { text-align: center; padding: 40px 20px; color: var(--muted); }
        .empty-state i { font-size: 2.5rem; display: block; margin-bottom: 12px; color: #c8d8fb; }

        /* ===== ENROLL CARD ===== */
        .enroll-card {
            background: #fff;
            border-radius: 24px;
            padding: 26px;
            border: 1px solid var(--border);
            box-shadow: 0 10px 34px rgba(18, 32, 63, 0.07);
            position: sticky;
            top: 100px;
        }
        .enroll-card .price-block { text-align: center; margin-bottom: 20px; }
        .enroll-card .price-block .price { font-size: 2.1rem; font-weight: 800; color: var(--primary); }
        .enroll-card .price-block .price small { font-size: 0.95rem; font-weight: 600; color: var(--muted); }
        .enroll-card .btn-whatsapp {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            background: #25D366;
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 16px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            transition: 0.25s;
            margin-bottom: 12px;
            font-family: inherit;
        }
        .enroll-card .btn-whatsapp:hover { background: #1ebe5b; transform: translateY(-2px); }
        .enroll-card .btn-share {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            background: var(--bg);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 13px;
            border-radius: 16px;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            transition: 0.25s;
        }
        .enroll-card .btn-share:hover { background: #e9efff; }
        .enroll-card .divider { height: 1px; background: var(--border); margin: 20px 0; }
        .enroll-card .info-list { display: flex; flex-direction: column; gap: 12px; }
        .enroll-card .info-list .info-row {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.87rem;
            color: #3d5578;
        }
        .enroll-card .info-list .info-row i { color: var(--primary); width: 18px; flex-shrink: 0; }

        /* ===== VIDEO OVERLAY ===== */
        .video-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            background: var(--dark-overlay);
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(8px);
            animation: fadeIn 0.3s ease;
            padding: 20px;
        }
        .video-overlay.active { display: flex; }
        .video-overlay .video-container {
            width: 100%;
            max-width: 1000px;
            background: #000;
            border-radius: 20px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.7);
        }
        .video-overlay .video-container iframe { display: block; }
        .video-overlay .close-video {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.6);
            border: none;
            color: #fff;
            padding: 8px 16px;
            border-radius: 40px;
            font-size: 0.85rem;
            cursor: pointer;
            font-family: inherit;
            transition: 0.3s;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .video-overlay .close-video:hover { background: rgba(255, 255, 255, 0.25); }
        .video-overlay .video-title {
            padding: 10px 16px;
            color: #fff;
            font-size: 0.95rem;
            font-weight: 600;
            background: rgba(0, 0, 0, 0.85);
            text-align: center;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* ===== LOADING ===== */
        .loading-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            background: rgba(18, 32, 63, 0.35);
            backdrop-filter: blur(3px);
            z-index: 9998;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255, 255, 255, 0.35);
            border-top: 5px solid var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .custom-alert {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10000;
            animation: fadeInScale 0.2s ease-out;
            max-width: 90%;
            width: 100%;
            direction: rtl;
        }
        @keyframes fadeInScale {
            from { opacity: 0; transform: translate(-50%, -50%) scale(0.9); }
            to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 992px) {
            .layout { grid-template-columns: 1fr; }
            .enroll-card { position: relative; top: 0; order: -1; }
        }
        @media (max-width: 768px) {
            .app-header { padding: 12px 16px; gap: 10px; }
            .app-header .logo { font-size: 1.1rem; gap: 8px; }
            .app-header .logo .logo-img { width: 32px; height: 32px; }
            .app-header .header-actions { gap: 10px; }
            .app-header .header-actions .user-name { display: none; }
            .app-header .header-actions .back-btn { padding: 7px 14px; font-size: 0.8rem; }
            .main-content { padding: 20px 14px 50px; }
            .layout { gap: 20px; }
            .course-hero { border-radius: 20px; margin-bottom: 20px; }
            .course-hero .hero-img { height: 200px; font-size: 3.5rem; }
            .course-hero .hero-body { padding: 20px 18px 22px; }
            .course-hero .hero-body h1 { font-size: 1.4rem; }
            .course-hero .hero-body .stats-row .stat { padding: 6px 12px; font-size: 0.78rem; }
            .tabs-bar { width: 100%; justify-content: flex-start; }
            .tabs-bar .tab-btn { padding: 10px 18px; font-size: 0.85rem; }
            .section-card { border-radius: 20px; padding: 20px 16px 22px; }
            .lesson-card { padding: 14px; gap: 12px; border-radius: 14px; }
            .lesson-card .lesson-num { width: 36px; height: 36px; font-size: 0.85rem; }
            .lesson-card .lesson-info h3 { font-size: 0.9rem; }
            .enroll-card { padding: 22px 20px; border-radius: 20px; }
            .video-overlay { padding: 10px; }
        }
        @media (max-width: 480px) {
            .main-content { padding: 16px 10px 40px; }
            .course-hero .hero-img { height: 170px; font-size: 3rem; }
            .course-hero .hero-body h1 { font-size: 1.2rem; }
            .section-card { padding: 18px 12px 20px; border-radius: 18px; }
            .lesson-card { padding: 12px 10px; gap: 10px; }
            .lesson-card .lesson-num { width: 32px; height: 32px; font-size: 0.8rem; }
            .enroll-card { padding: 18px 16px; border-radius: 18px; }
        }
        @media (max-width: 360px) {
            .lesson-card .lesson-status { display: none; }
        }
    </style>
</head>
<body>

    <header class="app-header">
        <a href="courses.html" class="logo">
            <img src="./images/logo.png" alt="لميناهالك" class="logo-img" />
            لميناهالك
        </a>
        <div class="header-actions">
            <span class="user-name" id="userName">مرحباً، طالب</span>
            <button onclick="goBack()" class="back-btn">
                <i class="fas fa-arrow-right"></i> رجوع
            </button>
        </div>
    </header>

    <main class="main-content">
        <div class="layout">
            <div>
                <section class="course-hero">
                    <div class="hero-img" id="courseImage">
                        <i class="fas fa-book"></i>
                    </div>
                    <div class="hero-body">
                        <span class="badge" id="courseBadge">الثالث الإعدادي</span>
                        <h1 id="courseTitle">جاري التحميل...</h1>
                        <div class="teacher-row">
                            <span class="t-avatar" id="teacherInitial">م</span>
                            <span id="courseTeacher">مدرس</span>
                        </div>
                        <p class="description" id="courseDescription"></p>
                        <div class="stats-row">
                            <span class="stat"><i class="fas fa-book-open"></i> <span id="courseLessonsCount">0</span> درس</span>
                            <span class="stat"><i class="fas fa-calendar-alt"></i> يبدأ <span id="courseStart">—</span></span>
                            <span class="stat"><i class="fas fa-calendar-check"></i> ينتهي <span id="courseEnd">—</span></span>
                        </div>
                    </div>
                </section>

                <div class="tabs-bar">
                    <button class="tab-btn active" data-tab="content">📖 محتوى الكورس</button>
                    <button class="tab-btn" data-tab="about">ℹ️ عن الكورس</button>
                </div>

                <section class="section-card" id="tabContent">
                    <div class="section-title">
                        📚 محتوى الدورة
                        <span class="count" id="lessonsCount">(0)</span>
                    </div>
                    <div id="lessonsContainer"></div>
                </section>

                <section class="section-card" id="tabAbout" style="display:none;">
                    <div class="section-title">ℹ️ عن الكورس</div>
                    <p id="aboutText" style="color:#3d5578; line-height:1.9; font-size:0.95rem;"></p>
                </section>
            </div>

            <aside class="enroll-card">
                <div class="price-block">
                    <div class="price" id="sidePriceText">—</div>
                </div>

                <a class="btn-whatsapp" id="whatsappBtn" href="#" target="_blank" rel="noopener">
                    <i class="fab fa-whatsapp"></i> اشترك عن طريق واتساب
                </a>
                <button class="btn-share" onclick="shareCourse()">
                    <i class="fas fa-share-alt"></i> مشاركة الكورس
                </button>

                <div class="divider"></div>

                <div class="info-list">
                    <div class="info-row"><i class="fas fa-chalkboard-teacher"></i> <span id="sideTeacher">مدرس</span></div>
                    <div class="info-row"><i class="fas fa-book-open"></i> <span id="sideLessons">0 درس</span></div>
                    <div class="info-row"><i class="fas fa-calendar-alt"></i> <span id="sideDates">—</span></div>
                    <div class="info-row"><i class="fas fa-shield-alt"></i> دعم فني متواصل عبر واتساب</div>
                </div>
            </aside>
        </div>
    </main>

    <div class="video-overlay" id="videoOverlay">
        <div class="video-container" id="videoContainer">
            <button class="close-video" onclick="closeVideo()">
                <i class="fas fa-times"></i> إغلاق
            </button>
            <div id="videoFrameWrapper" style="position:relative; width:100%; padding-bottom:56.25%; background:#000;">
                <iframe id="videoFrame"
                        style="position:absolute; top:0; left:0; width:100%; height:100%; border:0;"
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                        allowfullscreen></iframe>
            </div>
            <div class="video-title" id="videoTitle"></div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDQ8LFihzOPueW0_FCgRF6uEiAMgn24sF8",
            authDomain: "nemo-8d0c7.firebaseapp.com",
            projectId: "nemo-8d0c7",
            storageBucket: "nemo-8d0c7.firebasestorage.app",
            messagingSenderId: "585101385202",
            appId: "1:585101385202:web:fb703a536893fb4aaadf6b"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        // ✅ رقم الدعم (بصيغة دولية لـ wa.me)
        const SUPPORT_PHONE = "201229931647";

        let currentUser = null;
        let courseId = null;
        let currentCourse = null;
        let teacherName = 'مدرس';
        let allLessons = [];

        // ============================================================
        //  HELPERS
        // ============================================================
        function showLoading(show = true) {
            let loader = document.querySelector('.loading-overlay');
            if (show) {
                if (loader) return;
                const div = document.createElement('div');
                div.className = 'loading-overlay';
                div.innerHTML = '<div class="spinner"></div>';
                document.body.appendChild(div);
            } else {
                if (loader) loader.remove();
            }
        }

        function showCustomAlert(icon, title, message, callback) {
            const oldAlert = document.querySelector(".custom-alert");
            if (oldAlert) oldAlert.remove();
            let bgColor, iconEmoji;
            if (icon === "success") { bgColor = "linear-gradient(135deg, #3062e3, #1f45b0)"; iconEmoji = "✅"; }
            else if (icon === "warning") { bgColor = "linear-gradient(135deg, #f39c12, #e67e22)"; iconEmoji = "⚠️"; }
            else if (icon === "error") { bgColor = "linear-gradient(135deg, #e74c3c, #c0392b)"; iconEmoji = "❌"; }
            else { bgColor = "#3062e3"; iconEmoji = "ℹ️"; }
            const alertDiv = document.createElement("div");
            alertDiv.className = "custom-alert";
            alertDiv.innerHTML = `
                <div style="background: ${bgColor}; direction: rtl; text-align: center; padding: 1.5rem 2rem; border-radius: 1.5rem; color: white; box-shadow: 0 20px 45px -10px rgba(0,0,0,0.3); min-width: 280px; border: 1px solid rgba(255,255,255,0.1);">
                    <div style="font-size: 2.5rem; margin-bottom: 8px;">${iconEmoji}</div>
                    <h3 style="margin: 0 0 10px 0; font-weight: 700; font-size: 1.2rem;">${title}</h3>
                    <p style="margin: 0; font-size: 0.95rem; opacity: 0.95; white-space: pre-wrap; line-height: 1.6;">${message}</p>
                    <div style="margin-top: 16px;"><button class="alert-close-btn" style="background: rgba(255,255,255,0.15); border: none; padding: 8px 28px; border-radius: 50px; color: white; cursor: pointer; font-weight: 600; font-size: 0.95rem;">حسنًا</button></div>
                </div>
            `;
            document.body.appendChild(alertDiv);
            alertDiv.querySelector(".alert-close-btn").addEventListener("click", () => {
                alertDiv.remove();
                if (callback) callback();
            });
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str || '';
            return div.innerHTML;
        }

        function goBack() { window.history.back(); }

        function isVideoUrl(url) {
            if (!url) return false;
            const videoPatterns = [
                'drive.google.com/file/d', 'drive.google.com/open',
                '.mp4', '.webm', '.mov', 'video'
            ];
            return videoPatterns.some(pattern => url.toLowerCase().includes(pattern));
        }

        // ✅ استخراج ID ملف Google Drive من أي شكل من أشكال الرابط
        function extractDriveId(url) {
            if (!url) return '';
            const patterns = [
                /drive\.google\.com\/file\/d\/([^\/\n?#]+)/,
                /drive\.google\.com\/open\?id=([^&\n?#]+)/,
                /drive\.google\.com\/uc\?(?:export=download&)?id=([^&\n?#]+)/
            ];
            for (const p of patterns) {
                const m = url.match(p);
                if (m && m[1]) return m[1];
            }
            return '';
        }

        // ✅ فحص اشتراك الطالب في الكورس
        async function checkSubscription(cid) {
            if (!currentUser) return false;
            try {
                const snapshot = await db.collection('subscriptions')
                    .where('studentId', '==', currentUser.uid)
                    .where('courseId', '==', cid)
                    .where('status', '==', 'active')
                    .limit(1)
                    .get();
                return !snapshot.empty;
            } catch (err) {
                console.error('Subscription check error:', err);
                return false;
            }
        }

        function getCourseId() {
            const params = new URLSearchParams(window.location.search);
            courseId = params.get("courseId") || params.get("id");
            if (!courseId) {
                showCustomAlert('error', 'خطأ', 'لم يتم تحديد الكورس', () => {
                    window.location.href = 'courses.html';
                });
                return false;
            }
            return true;
        }

        async function loadTeacherName(teacherId) {
            if (!teacherId) return 'مدرس';
            try {
                const doc = await db.collection('users').doc(teacherId).get();
                return doc.exists ? (doc.data().name || 'مدرس') : 'مدرس';
            } catch (e) {
                return 'مدرس';
            }
        }

        // ============================================================
        //  LOAD COURSE
        // ============================================================
        async function loadCourse() {
            const doc = await db.collection("courses").doc(courseId).get();
            if (!doc.exists) {
                showCustomAlert('error', 'خطأ', 'الكورس غير موجود', () => {
                    window.location.href = 'courses.html';
                });
                return;
            }
            currentCourse = { id: doc.id, ...doc.data() };
            teacherName = await loadTeacherName(currentCourse.teacherId);

            document.getElementById("courseTitle").textContent = currentCourse.title || "بدون عنوان";
            document.getElementById("courseDescription").textContent = currentCourse.description || "";
            document.getElementById("courseTeacher").textContent = teacherName;
            document.getElementById("teacherInitial").textContent = teacherName.trim().charAt(0) || "م";
            document.getElementById("courseLessonsCount").textContent = currentCourse.totalLessons || 0;
            document.getElementById("courseStart").textContent = currentCourse.startDate || "—";
            document.getElementById("courseEnd").textContent = currentCourse.endDate || "—";

            const imageEl = document.getElementById("courseImage");
            if (currentCourse.imageUrl) {
                imageEl.innerHTML = `
                    <img src="${currentCourse.imageUrl}" alt="${escapeHtml(currentCourse.title)}" />
                    <span class="price-chip">${currentCourse.price != null ? currentCourse.price + ' ج.م' : 'مجاني'}</span>
                `;
            } else {
                imageEl.innerHTML = `
                    <i class="fas fa-book"></i>
                    <span class="price-chip">${currentCourse.price != null ? currentCourse.price + ' ج.م' : 'مجاني'}</span>
                `;
            }

            document.getElementById("sidePriceText").innerHTML =
                currentCourse.price != null ? `${currentCourse.price} <small>ج.م</small>` : 'مجاني';
            document.getElementById("sideTeacher").textContent = teacherName;
            document.getElementById("sideLessons").textContent = `${currentCourse.totalLessons || 0} درس`;
            document.getElementById("sideDates").textContent =
                `${currentCourse.startDate || '—'} → ${currentCourse.endDate || '—'}`;

            const waMessage = encodeURIComponent(`أهلاً، عايز أشترك في كورس "${currentCourse.title}"`);
            document.getElementById("whatsappBtn").href = `https://wa.me/${SUPPORT_PHONE}?text=${waMessage}`;

            document.getElementById("aboutText").textContent =
                currentCourse.description || "لا يوجد وصف تفصيلي لهذا الكورس بعد.";

            document.title = `لميناهالك • ${currentCourse.title || 'الكورس'}`;
        }

        // ============================================================
        //  LOAD LESSONS
        // ============================================================
        async function loadLessons() {
            try {
                const snapshot = await db.collection("lessons")
                    .where("courseId", "==", courseId)
                    .get();
                allLessons = [];
                snapshot.forEach(doc => allLessons.push({ id: doc.id, ...doc.data() }));
                allLessons.sort((a, b) => (a.order || 0) - (b.order || 0));
                document.getElementById("lessonsCount").textContent = `(${allLessons.length})`;
                renderLessons();
            } catch (error) {
                console.error("خطأ في تحميل الدروس:", error);
                renderLessons();
            }
        }

        function renderLessons() {
            const container = document.getElementById("lessonsContainer");
            if (allLessons.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-book-open"></i>
                        <p>لسه معملش محتوى للكورس ده</p>
                        <p style="font-size:0.85rem;">هيتم إضافة الدروس قريبًا</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = allLessons.map((lesson, index) => {
                const lessonNumber = String(index + 1).padStart(2, "0");
                const isFree = lesson.isFree === true;
                let typeLabel = '📝 محتوى';
                let typeClass = '';
                const mediaUrl = lesson.mediaUrl || lesson.videoUrl || lesson.fileUrl || '';

                if (lesson.contentType === 'lesson' || isVideoUrl(mediaUrl)) {
                    typeLabel = '🎬 فيديو'; typeClass = 'video';
                } else if (lesson.contentType === 'file' || mediaUrl.match(/\.(pdf|doc|docx|ppt|pptx|xls|xlsx|txt)$/i)) {
                    typeLabel = '📄 ملف'; typeClass = 'file';
                } else if (lesson.contentType === 'exam') {
                    typeLabel = '📝 اختبار';
                } else if (lesson.contentType === 'exercise') {
                    typeLabel = '✏️ تدريب';
                } else if (mediaUrl && (mediaUrl.includes('meet.google.com') || mediaUrl.includes('zoom.us') || mediaUrl.includes('teams.microsoft.com'))) {
                    typeLabel = '🔗 رابط خارجي'; typeClass = 'video';
                }

                return `
                    <div class="lesson-card" onclick="openLesson('${lesson.id}')">
                        <div class="lesson-num">${lessonNumber}</div>
                        <div class="lesson-info">
                            <h3>${escapeHtml(lesson.title || 'محاضرة بدون عنوان')}</h3>
                            <div class="lesson-meta">
                                <span><i class="fas fa-clock"></i> ${lesson.duration || 0} دقيقة</span>
                                <span class="lesson-type-badge ${typeClass}">${typeLabel}</span>
                            </div>
                        </div>
                        <span class="lesson-status ${isFree ? 'free' : 'available'}">${isFree ? '🎁 مجاني' : '📺 مشاهدة'}</span>
                        <i class="fas fa-chevron-left lesson-arrow"></i>
                    </div>
                `;
            }).join('');
        }

        // ============================================================
        //  OPEN LESSON (with subscription check)
        // ============================================================
        async function openLesson(lessonId) {
            const lesson = allLessons.find(l => l.id === lessonId);
            if (!lesson) { showCustomAlert('error', 'خطأ', 'الدرس غير موجود'); return; }

            const mediaUrl = lesson.mediaUrl || lesson.videoUrl || lesson.fileUrl || '';
            if (!mediaUrl) { showCustomAlert('warning', 'تنبيه', 'لا يوجد رابط لهذا المحتوى'); return; }

            // ✅ 1) لو الدرس مش مجاني → نتأكد إن الطالب مشترك
            if (!lesson.isFree) {
                showLoading(true);
                const isSubscribed = await checkSubscription(courseId);
                showLoading(false);

                if (!isSubscribed) {
                    showCustomAlert(
                        'warning',
                        '🔒 المحتوى مقفول',
                        'الدرس ده متاح للمشتركين فقط.\nاشترك في الكورس عشان تقدر تشوفه.',
                        () => {
                            const msg = encodeURIComponent(`أهلاً، عايز أشترك في كورس "${currentCourse?.title || ''}"`);
                            window.open(`https://wa.me/${SUPPORT_PHONE}?text=${msg}`, '_blank');
                        }
                    );
                    return;
                }
            }

            // ✅ 2) عرض المحتوى
            // لو Google Drive → نعرضه في iframe على طول
            const driveId = extractDriveId(mediaUrl);
            if (driveId) {
                openDrivePlayer(driveId, lesson.title || 'فيديو');
                return;
            }

            // روابط فيديو عادية (mp4/webm/mov) → تفتح في تاب جديد
            if (mediaUrl.match(/\.(mp4|webm|mov)(\?.*)?$/i)) {
                window.open(mediaUrl, '_blank');
                return;
            }

            // أي رابط تاني (Meet/Zoom/PDF...) → يفتح في تاب جديد
            if (mediaUrl.startsWith('http')) {
                window.open(mediaUrl, '_blank');
                return;
            }

            showCustomAlert('warning', 'تنبيه', 'نوع المحتوى غير معروف');
        }

        // ============================================================
        //  IFRAME PLAYER (للدرايف)
        // ============================================================
        function openIframePlayer(src, title) {
            const overlay = document.getElementById('videoOverlay');
            const iframe = document.getElementById('videoFrame');
            const titleEl = document.getElementById('videoTitle');

            iframe.src = src;
            titleEl.textContent = title || 'فيديو';

            overlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        // ✅ عرض فيديو الدرايف في iframe مباشرة
        function openDrivePlayer(driveId, title) {
            openIframePlayer(
                `https://drive.google.com/file/d/${driveId}/preview`,
                title
            );
        }

        function closeVideo() {
            const overlay = document.getElementById('videoOverlay');
            const iframe = document.getElementById('videoFrame');
            iframe.src = ''; // يوقف الفيديو فورًا
            overlay.classList.remove('active');
            document.body.style.overflow = '';
        }

        // ============================================================
        //  SHARE
        // ============================================================
        function shareCourse() {
            const url = window.location.href;
            if (navigator.share) {
                navigator.share({
                    title: currentCourse?.title || 'كورس مميز',
                    text: `📚 اكتشف كورس ${currentCourse?.title || ''} على منصة لميناهالك`,
                    url: url
                }).catch(() => {});
            } else {
                navigator.clipboard.writeText(url).then(() => {
                    showCustomAlert('success', 'تم النسخ', 'تم نسخ رابط الكورس إلى الحافظة');
                }).catch(() => {
                    showCustomAlert('info', 'الرابط', url);
                });
            }
        }

        // ============================================================
        //  TABS
        // ============================================================
        function initTabs() {
            const buttons = document.querySelectorAll('.tab-btn');
            buttons.forEach(btn => {
                btn.addEventListener('click', () => {
                    buttons.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    const tab = btn.dataset.tab;
                    document.getElementById('tabContent').style.display = tab === 'content' ? 'block' : 'none';
                    document.getElementById('tabAbout').style.display = tab === 'about' ? 'block' : 'none';
                });
            });
        }

        // ============================================================
        //  USER DATA
        // ============================================================
        async function loadUserData(uid) {
            try {
                const doc = await db.collection('users').doc(uid).get();
                if (doc.exists) {
                    const data = doc.data();
                    document.getElementById('userName').textContent = `مرحباً، ${data.name || 'طالب'}`;
                }
            } catch (error) {
                console.error("خطأ في تحميل بيانات المستخدم:", error);
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') { closeVideo(); }
        });

        // ============================================================
        //  INIT
        // ============================================================
        async function init() {
            initTabs();
            if (!getCourseId()) return;
            auth.onAuthStateChanged(async (user) => {
                if (user) {
                    currentUser = user;
                    showLoading(true);
                    try {
                        await loadUserData(user.uid);
                        await loadCourse();
                        await loadLessons();
                    } catch (error) {
                        console.error("خطأ في تهيئة الصفحة:", error);
                        showCustomAlert('error', 'خطأ', 'حدث خطأ أثناء تحميل الصفحة');
                    } finally {
                        showLoading(false);
                    }
                } else {
                    showCustomAlert('warning', 'تنبيه', '⚠️ يرجى تسجيل الدخول أولاً', () => {
                        window.location.href = '../index.html';
                    });
                }
            });
        }

        // Window exports
        window.openLesson = openLesson;
        window.goBack = goBack;
        window.shareCourse = shareCourse;
        window.openDrivePlayer = openDrivePlayer;
        window.closeVideo = closeVideo;

        document.addEventListener('DOMContentLoaded', init);
    </script>

</body>
</html>
